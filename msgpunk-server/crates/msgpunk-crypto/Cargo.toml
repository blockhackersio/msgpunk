[package]
name = "msgpunk-crypto"
version = "0.1.0"
edition = "2024"

[dependencies]
bip39 = "2"
ed25519-dalek = "2"
age = { version = "0.12", features = ["armor"] }
sha2 = "0.10"
hex = "0.4"
x25519-dalek = "2"
hmac = "0.12"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
aes-gcm = "0.10"
bech32 = "0.11"
base64-simd = "0.8"
secrecy = "0.10"
