[package]
name = "msgpunk-server"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-web = "4"
actix-rt = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
msgpunk-crypto = { path = "../msgpunk-crypto" }
msgpunk-storage = { path = "../msgpunk-storage" }
ulid = "1"
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["full"] }
ed25519-dalek = "2"
hex = "0.4"
rust-embed = "8"
mime_guess = "2"
tera = "1"
actix-cors = "0.7"
